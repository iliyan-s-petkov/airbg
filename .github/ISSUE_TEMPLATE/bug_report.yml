name: Bug report
description: Something in the app or API is broken
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL or endpoint
      placeholder: "https://airbg.org/... or /api/v1/..."
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, or "API client" if not the website
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
    validations:
      required: false
