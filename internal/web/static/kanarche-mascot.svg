<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Kanarche: canary with a tricolour headband and a katana (white, green, red)"><title>Kanarche: canary with a tricolour headband and a katana (white, green, red)</title><style>
.bob{animation:bob 3.4s ease-in-out infinite alternate}
