.sw{transform-box:view-box;transform-origin:98px 146px;animation:sway 3.4s ease-in-out infinite alternate}
@keyframes flA{from{transform:rotate(5deg)}to{transform:rotate(-7deg) scaleX(1.04)}}
@keyframes flB{from{transform:rotate(-4deg)}to{transform:rotate(8deg) scaleX(.96)}}
